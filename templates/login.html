<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexorAI — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #060608;
            color: #F0F0F2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Galaxy canvas background */
        #galaxy-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.5;
        }

        /* Radial vignette */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(6,6,8,0.85) 100%);
        }

        /* Auth Card */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .logo-row-img {
            width: 40px; height: 40px;
            border-radius: 8px;
            background: #000;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-row-img img {
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .back-link {
            position: fixed; top: 22px; left: 24px; z-index: 20;
            display: inline-flex; align-items: center; gap: 7px;
            color: rgba(255,255,255,0.45); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: color 0.2s;
        }
        .back-link:hover { color: rgba(255,255,255,0.85); }
        .back-link svg { width:15px; height:15px; }
        .logo-row .brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* Tab switcher */
        .tab-switch {
            display: flex;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .tab-switch button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #7A7A8C;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .tab-switch button.active {
            background: #FFF;
            color: #000;
        }

        /* Google button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 13px;
            background: #FFF;
            color: #1F1F1F;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .google-btn:hover { background: #F0F0F0; transform: translateY(-1px); }
        .google-btn svg { flex-shrink: 0; }

        /* Divider */
        .divider {
            display: flex; align-items: center; gap: 12px;
            color: #4A4A5A; font-size: 12px; margin-bottom: 24px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            height: 1px; background: rgba(255,255,255,0.08);
        }

        /* Form */
        .form-group { margin-bottom: 14px; }
        label {
            display: block; font-size: 13px;
            color: #A0A0B0; margin-bottom: 6px; font-weight: 500;
        }
        input {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #F0F0F2;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: rgba(108,99,255,0.5);
            background: rgba(108,99,255,0.05);
            box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
        }
        input::placeholder { color: #4A4A5A; }

        /* Submit */
        .submit-btn {
            width: 100%; padding: 13px;
            background: #FFF; color: #000;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600;
            font-family: inherit; cursor: pointer;
            transition: all 0.2s; margin-top: 6px;
        }
        .submit-btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Switch */
        .switch-row {
            text-align: center; margin-top: 24px;
            font-size: 13px; color: #7A7A8C;
        }
        .switch-row a {
            color: #A09AF8; text-decoration: none;
            font-weight: 500; cursor: pointer;
        }
        .switch-row a:hover { text-decoration: underline; }

        /* Status messages */
        .status-msg {
            margin-top: 14px; padding: 12px 14px;
            border-radius: 10px; font-size: 13px;
            display: none; text-align: center;
        }
        .status-msg.error { background: rgba(239,68,68,0.1); color: #F87171; border: 1px solid rgba(239,68,68,0.2); display: block; }
        .status-msg.success { background: rgba(16,185,129,0.1); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.2); display: block; }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            display: none; animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                overflow-y: auto;
                padding: 76px 16px 24px;
            }
            .auth-card {
                width: 100%;
                max-width: none;
                margin: 0;
                padding: 32px 20px;
                border-radius: 16px;
            }
            .back-link { top: 18px; left: 16px; }
            .logo-row { margin-bottom: 24px; }
            .logo-row .brand { font-size: 20px; }
            .tab-switch { margin-bottom: 22px; }
            .google-btn { margin-bottom: 20px; }
        }
    </style>
</head>
<body>
    <div id="galaxy-bg"></div>
    <div class="vignette"></div>

    <!-- Back to home -->
    <a class="back-link" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to Home
    </a>

    <div class="auth-card">
        <!-- Logo -->
        <div class="logo-row">
            <div class="logo-row-img"><img src="/static/assets/NexorSplash.png" alt="NexorAI Logo"></div>
            <span class="brand">NexorAI</span>
        </div>

        <!-- Tab switch -->
        <div class="tab-switch">
            <button id="loginTab" class="active" onclick="setMode('login')">Sign In</button>
            <button id="signupTab" onclick="setMode('signup')">Sign Up</button>
        </div>

        <!-- Google -->
        <button class="google-btn" onclick="handleGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider"><span>or</span></div>

        <!-- Form -->
        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="form-group" id="nameGroup" style="display:none;">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="8">
            </div>
            <div class="form-group" id="dobGroup" style="display:none;">
                <label>Date of Birth</label>
                <input type="date" id="dob">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">Sign In</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="status-msg" id="statusMsg"></div>

        <div class="switch-row">
            <span id="switchText">Don't have an account?</span>&nbsp;
            <a id="switchLink" onclick="setMode('signup')">Create one</a>
        </div>
    </div>

    <script type="module">
        import { initGalaxy } from '/static/galaxy.js';
        initGalaxy('galaxy-bg');
    </script>
    <script>
        if (localStorage.getItem('nexoraiUser')) window.location.href = '/chatbot';

        let mode = 'login';

        window.setMode = function(m) {
            mode = m;
            const isSignup = m === 'signup';
            document.getElementById('loginTab').classList.toggle('active', !isSignup);
            document.getElementById('signupTab').classList.toggle('active', isSignup);
            document.getElementById('nameGroup').style.display = isSignup ? 'block' : 'none';
            document.getElementById('dobGroup').style.display = isSignup ? 'block' : 'none';
            document.getElementById('name').required = isSignup;
            document.getElementById('dob').required = isSignup;
            document.getElementById('btnText').textContent = isSignup ? 'Create Account' : 'Sign In';
            document.getElementById('switchText').textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('switchLink').textContent = isSignup ? 'Sign in' : 'Create one';
            document.getElementById('switchLink').onclick = () => setMode(isSignup ? 'login' : 'signup');
            document.getElementById('statusMsg').className = 'status-msg';
        };

        window.handleGoogle = function() {
            showStatus('Google OAuth requires backend configuration. Use email/password for now.', 'error');
        };

        window.handleSubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            document.getElementById('statusMsg').className = 'status-msg';

            const payload = mode === 'login'
                ? { email: document.getElementById('email').value, password: document.getElementById('password').value }
                : { name: document.getElementById('name').value, email: document.getElementById('email').value, password: document.getElementById('password').value, DOB: document.getElementById('dob').value };

            try {
                const res = await fetch(mode === 'login' ? '/users/login' : '/users/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let data = {};
                try { data = await res.json(); } catch(err) {}
                if (!res.ok) throw new Error(data.message || data.error || 'Authentication failed');
                localStorage.setItem('nexoraiUser', JSON.stringify(data.data?.user || { email: payload.email }));
                showStatus('Success! Redirecting…', 'success');
                setTimeout(() => window.location.href = '/chatbot', 1000);
            } catch(err) {
                showStatus(err.message, 'error');
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        };

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = `status-msg ${type}`;
        }
    </script>
</body>
</html>
