<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexorAI - Assistant Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* 3D Code Text Background */
        .code-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .code-container {
            position: relative;
            width: 200%;
            height: 200%;
            transform: rotateX(60deg) rotateZ(-45deg);
            transform-origin: center;
        }

        .code-line {
            position: absolute;
            color: #0ea5e9;
            font-family: monospace;
            font-size: 1.2rem;
            white-space: nowrap;
            opacity: 0.2;
            text-shadow: 0 0 5px #0ea5e9, 0 0 10px #38bdf8;
        }

        /* The animated typing effect */
        @keyframes typeCode {
            to {
                width: 100%;
            }
        }

        /* Gradient Overlay for Depth */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.9) 80%);
            z-index: 2;
        }

        .container {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 40px;
            width: 450px;
            max-width: 90%;
            box-shadow:
                0 0 60px rgba(56, 189, 248, 0.2),
                inset 0 0 40px rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.3);
            position: relative;
            z-index: 10;
            animation: floatContainer 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes floatContainer {

            0%,
            100% {
                transform: translateY(0px) rotateX(2deg);
            }

            50% {
                transform: translateY(-15px) rotateX(-2deg);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9, #06b6d4, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                filter: brightness(1) drop-shadow(0 0 5px rgba(56, 189, 248, 0.5));
            }

            to {
                filter: brightness(1.2) drop-shadow(0 0 15px rgba(168, 85, 247, 0.6));
            }
        }

        .logo p {
            color: #94a3b8;
            font-size: 15px;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.8);
            box-shadow:
                0 0 15px rgba(56, 189, 248, 0.4),
                inset 0 0 10px rgba(56, 189, 248, 0.1);
            transform: translateZ(10px);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px) translateZ(15px);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.6);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #64748b;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
            font-size: 14px;
        }


        .success-message {
            display: none;
            text-align: center;
            color: #10b981;
            font-size: 14px;
            margin-top: 15px;
            padding: 12px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-switch {
            display: flex;
            gap: 8px;
            margin: 0 0 24px;
            padding: 5px;
            border: 1px solid rgba(31, 174, 239, 0.35);
            border-radius: 12px;
        }

        .auth-switch button {
            flex: 1;
            border: 0;
            border-radius: 8px;
            padding: 11px;
            color: #aebbd0;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-switch button.active {
            color: #fff;
            background: linear-gradient(135deg, #16a9e5, #7656eb);
        }
    </style>
</head>

<body>
    <!-- 3D Background setup -->
    <div class="code-bg" id="codeBg">
        <div class="code-container" id="codeContainer"></div>
    </div>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="logo">
            <h1>NexorAI</h1>
            <p>Enter the next generation of Intelligence</p>
        </div>

        <form id="loginForm">
            <div class="auth-switch" role="tablist" aria-label="Authentication mode">
                <button type="button" id="loginTab" class="active">Login</button>
                <button type="button" id="signupTab">Sign Up</button>
            </div>
            <p id="authHint" style="text-align: center; color: #aebbd0; margin: -12px 0 20px;">
                Already have an account? Enter your email and password.
            </p>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required minlength="2">
                <span class="error-message" id="nameError">Please enter a valid name</span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                <span class="error-message" id="emailError">Please enter a valid email</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
                <span class="error-message" id="passwordError">Use at least 8 characters</span>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
                <span class="error-message" id="dobError">Please enter a valid Date of Birth</span>
            </div>

            <button type="submit" class="btn-submit">
                <div class="btn-content">
                    <span class="btn-text">Login</span>
                    <div class="spinner"></div>
                </div>
            </button>



            <div class="success-message" id="successMessage">
                ✓ Connection Established! Redirecting to Core Matrix...
            </div>
            <div class="error-message" id="generalError" style="font-size: 14px; text-align: center; margin-top: 15px;">
            </div>
        </form>
    </div>

    <script>
        // Redirect if already logged in
        if (localStorage.getItem('nexoraiUser')) {
            window.location.href = '/chatbot';
        }

        // Generate 3D Background Code Lines
        const codeContainer = document.getElementById('codeContainer');
        const codeSnippets = [
            'function initializeAI() { return new NeuralNet(); }',
            'const quantum = await QuantumComputer.execute();',
            'matrix.multiply(tensor_weights).activate(ReLU);',
            'while (intelligence < SINGULARITY) { learn(); }',
            'if (user.connected) { syncData(); }',
            'export const AIEngine = new TransformerModel();',
            'byte[] payload = secureEncrypt(data, AES_256);',
            'import { DeepLearning } from "@nexorai/core";'
        ];

        for (let i = 0; i < 50; i++) {
            const line = document.createElement('div');
            line.className = 'code-line';
            line.textContent = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];

            // Random positioning
            line.style.top = Math.random() * 100 + '%';
            line.style.left = Math.random() * 50 + '%';

            // 3D placement
            const z = Math.random() * 400 - 200;
            line.style.transform = `translateZ(${z}px)`;

            // Animation
            line.style.animation = `typeCode ${Math.random() * 10 + 5}s linear infinite`;
            line.style.width = '0%';
            line.style.overflow = 'hidden';

            codeContainer.appendChild(line);
        }

        const form = document.getElementById('loginForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const dobInput = document.getElementById('dob');
        const submitBtn = form.querySelector('.btn-submit');
        const spinner = form.querySelector('.spinner');
        const btnText = form.querySelector('.btn-text');
        const successMessage = document.getElementById('successMessage');
        const generalError = document.getElementById('generalError');
        const authHint = document.getElementById('authHint');
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        let authMode = 'login';

        function setAuthMode(mode) {
            authMode = mode;
            const isSignup = mode === 'signup';
            loginTab.classList.toggle('active', !isSignup);
            signupTab.classList.toggle('active', isSignup);
            nameInput.closest('.form-group').style.display = isSignup ? 'block' : 'none';
            dobInput.closest('.form-group').style.display = isSignup ? 'block' : 'none';
            nameInput.required = isSignup;
            dobInput.required = isSignup;
            btnText.textContent = isSignup ? 'Create Account' : 'Login';
            authHint.textContent = isSignup
                ? 'New to NexorAI? Create your account in the Login collection.'
                : 'Already have an account? Enter your email and password.';
            successMessage.textContent = isSignup
                ? '✓ Account created! Redirecting to NexorAI...'
                : '✓ Login successful! Redirecting to NexorAI...';
            generalError.style.display = 'none';
        }

        loginTab.addEventListener('click', () => setAuthMode('login'));
        signupTab.addEventListener('click', () => setAuthMode('signup'));
        setAuthMode('login');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.querySelectorAll('.error-message').forEach(msg => msg.style.display = 'none');

            let isValid = true;
            if (authMode === 'signup' && nameInput.value.trim().length < 2) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            if (!emailInput.validity.valid) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            if (passwordInput.value.length < 8) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            if (authMode === 'signup' && !dobInput.value) {
                document.getElementById('dobError').style.display = 'block';
                isValid = false;
            }
            if (!isValid) return;

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`/users/${authMode === 'signup' ? 'signup' : 'login'}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(authMode === 'signup'
                        ? {
                            name: nameInput.value.trim(),
                            email: emailInput.value.trim(),
                            password: passwordInput.value,
                            DOB: dobInput.value
                        }
                        : {
                            email: emailInput.value.trim(),
                            password: passwordInput.value
                        })
                });

                let data;
                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    data = { message: text || `Request failed with status ${response.status}` };
                }

                if (!response.ok) {
                    throw new Error(data.message || 'Authentication Failed');
                }

                localStorage.setItem('nexoraiUser', JSON.stringify(data.data.user));

                spinner.style.display = 'none';
                btnText.textContent = 'Access Granted!';
                btnText.style.display = 'block';
                successMessage.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/chatbot';
                }, 1500);

            } catch (error) {
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                submitBtn.disabled = false;
                generalError.textContent = error.message || 'Authentication service is currently unavailable.';
                generalError.style.display = 'block';
            }
        });

    </script>
</body>

</html>
