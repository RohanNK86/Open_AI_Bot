<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Bot AI - Assistant Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particle {
            position: absolute;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        .container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px 40px;
            width: 450px;
            max-width: 90%;
            box-shadow:
                0 0 60px rgba(56, 189, 248, 0.3),
                0 0 100px rgba(14, 165, 233, 0.2),
                inset 0 0 40px rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            position: relative;
            z-index: 10;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.3);
            }
        }

        .logo p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.8);
            box-shadow:
                0 0 20px rgba(56, 189, 248, 0.3),
                inset 0 0 20px rgba(56, 189, 248, 0.05);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(6, 182, 212, 0.6);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .success-message {
            display: none;
            text-align: center;
            color: #10b981;
            font-size: 14px;
            margin-top: 15px;
            padding: 12px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 42px;
            color: #64748b;
            font-size: 18px;
            pointer-events: none;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <h1>Super Bot</h1>
            <p>Your Intelligent Assistant</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required minlength="2">
                <span class="input-icon">👤</span>
                <span class="error-message" id="nameError">Please enter a valid name</span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                <span class="input-icon">✉️</span>
                <span class="error-message" id="emailError">Please enter a valid email</span>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
                <span class="input-icon">📅</span>
                <span class="error-message" id="dobError">Please select your date of birth</span>
            </div>

            <button type="submit" class="btn-submit">
                <div class="btn-content">
                    <span class="btn-text">Continue to Super Bot AI</span>
                    <div class="spinner"></div>
                </div>
            </button>

            <div class="success-message" id="successMessage">
                ✓ Login successful! Redirecting to chatbot...
            </div>
        </form>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 100 + 50;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                document.body.appendChild(particle);
            }
        }
        createParticles();

        // Form handling
        const form = document.getElementById('loginForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const dobInput = document.getElementById('dob');
        const submitBtn = form.querySelector('.btn-submit');
        const spinner = form.querySelector('.spinner');
        const btnText = form.querySelector('.btn-text');
        const successMessage = document.getElementById('successMessage');

        // Set max date to today for DOB
        const today = new Date().toISOString().split('T')[0];
        dobInput.setAttribute('max', today);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset error messages
            document.querySelectorAll('.error-message').forEach(msg => msg.style.display = 'none');

            // Validate inputs
            let isValid = true;

            if (nameInput.value.trim().length < 2) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }

            if (!emailInput.validity.valid) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }

            if (!dobInput.value) {
                document.getElementById('dobError').style.display = 'block';
                isValid = false;
            }

            if (!isValid) return;

            // Show loading state
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;

            // Prepare user data
            const userData = {
                name: nameInput.value.trim(),
                email: emailInput.value.trim(),
                DOB: dobInput.value,
            };

            try {
                const response = await fetch('https://open-ai-bot-backend.onrender.com/users/signIN', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Something went wrong');
                }

                // Hide loading, show success
                spinner.style.display = 'none';
                btnText.textContent = 'Success!';
                btnText.style.display = 'block';
                successMessage.style.display = 'block';

                // Redirect to the chatbot page after 2 seconds
                setTimeout(() => {
                    window.location.href = '/chatbot'; // Redirect to the chatbot page
                }, 2000);

            } catch (error) {
                console.error('Login Error:', error);
                // Hide loading, show error
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                submitBtn.disabled = false;
                alert(`Login failed: ${error.message}`);
            }
        });

        dobInput.addEventListener('input', () => {
            if (dobInput.value) {
                document.getElementById('dobError').style.display = 'none';
            }
        });
    </script>
</body>

</html>
